[package]
name = "pymgr"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast Python environment manager written in Rust"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
walkdir = "2"
which = "6"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
zip = "2"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
indicatif = "0.17"
console = "0.15"
minijinja = "2"
rayon = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
tempdir = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
