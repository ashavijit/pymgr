name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version and Create Tag
    runs-on: ubuntu-latest
    outputs:
      create_release: ${{ steps.check.outputs.create_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version
        id: check
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          TAG="v$VERSION"
          if git tag -l | grep -q "^$TAG$"; then
            echo "Tag $TAG already exists. No new release needed."
            echo "create_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist. We need a new release."
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "create_release=true" >> $GITHUB_OUTPUT
          fi

  build-and-upload:
    name: Build & Upload Release Asset
    needs: check-version
    if: needs.check-version.outputs.create_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pymgr-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pymgr-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pymgr-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pymgr-windows-x86_64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Assets (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.artifact_name }} pymgr
        shell: bash

      - name: Prepare Assets (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path pymgr.exe -DestinationPath ../../../${{ matrix.artifact_name }}
        shell: powershell

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Release ${{ needs.check-version.outputs.tag }}
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
